name: Sync GitHub Portfolio Specimens

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/overrides.json'
      - 'scripts/sync-github.mjs'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync GitHub repos and merge overrides
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/sync-github.mjs

      - name: Commit updated specimens.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specimens.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): update specimen telemetry from GitHub API"
            git push
          else
            echo "No changes to commit."
          fi
